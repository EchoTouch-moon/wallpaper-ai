name: CI

on: [push, pull_request]

jobs:
  ci:
    name: Typecheck, Lint, Unit Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (packages/core + app/api)
        run: node --test --experimental-strip-types "packages/core/**/*.test.mjs" "app/api/**/*.test.mjs"

      - name: Build
        run: pnpm build
