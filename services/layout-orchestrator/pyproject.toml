[project]
name = "wallpaper-layout-orchestrator"
version = "0.1.0"
description = "LangGraph learning service for AI Wallpaper Studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "typing-extensions>=4.12",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layout_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
